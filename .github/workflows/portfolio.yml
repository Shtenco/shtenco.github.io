name: Portfolio A

on:
  push:
    branches: ["feat/portfolio-system-2026"]
  pull_request:
    paths:
      - "index.html"
      - "assets/**"
      - "data/**"
      - "tests/**"
      - "scripts/check_portfolio.py"
      - ".github/workflows/portfolio.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run portfolio tests
        run: python -m unittest discover -s tests -v
